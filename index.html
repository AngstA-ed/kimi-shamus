    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #0f0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 { display: none; }
    #game-container {
      position: relative;
      border: 2px solid #333;
    }
    #game-canvas {
      display: block;
      width: 640px;
      height: 480px;
      image-rendering: pixelated;
    }
  </style>

    // AUDIO SYSTEM
    // ============================================
    const AudioSys = {
      ctx: null,
      enabled: false,
      init() {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.enabled = true;
        } catch (e) {}
      },
      playTone(freq, duration, type = 'square', vol = 0.1) {
        if (!this.enabled || !this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime);
        osc.stop(this.ctx.currentTime + duration);
      },
      shoot() { this.playTone(880, 0.1); setTimeout(() => this.playTone(1100, 0.05), 20); },
      enemyDeath() { this.playTone(440, 0.15); setTimeout(() => this.playTone(220, 0.2), 50); },
      collect() { this.playTone(660, 0.1); setTimeout(() => this.playTone(880, 0.15), 50); setTimeout(() => this.playTone(1100, 0.2), 150); },
      transition() { this.playTone(150, 0.3, 'sawtooth'); },
      playerHit() { this.playTone(110, 0.3, 'sawtooth'); },
      menuMove() { this.playTone(600, 0.05); },
      menuSelect() { this.playTone(880, 0.1); }
    };

    // ============================================
    // ROOM GENERATION - USE AUTHENTIC MAZE DATA
    // ============================================
    function getRoomLayout(roomId) {
      const mazeRoom = roomMap.get(roomId);
      if (!mazeRoom) return null;
      
      // Base walls (room boundaries)
      const walls = [
        { x: 0, y: 0, w: 160, h: 4, type: 'h' },
        { x: 0, y: 80, w: 160, h: 4, type: 'h' },
        { x: 0, y: 0, w: 4, h: 84, type: 'v' },
        { x: 156, y: 0, w: 4, h: 84, type: 'v' }
      ];
      
      // Add internal walls based on room ID and maze type
      // Different layouts for different room ranges (quadrants)
      const quadrant = Math.floor(roomId / 16) % 4;
      const mazeType = Math.floor(roomId / 32); // 0-3 for the 4 main quadrants
      
      // Add some internal walls for variety (based on room ID)
      if (roomId % 7 === 0) {
        walls.push({ x: 60, y: 40, w: 40, h: 4, type: 'h' });
      } else if (roomId % 5 === 0) {
        walls.push({ x: 30, y: 20, w: 4, h: 40, type: 'v' });
      } else if (roomId % 11 === 0) {
        walls.push({ x: 126, y: 30, w: 4, h: 40, type: 'v' });
      }
      
      // Generate enemies based on level difficulty
      const enemies = [];
      const isBossRoom = roomId === 127;
      
      if (isBossRoom) {
        // Shadow Master boss - slower
        enemies.push({
          x: 80, y: 40, type: 'shadow', dx: 0.3, dy: 0.25,
          color: '#ff0000', active: true, boss: true
        });
      } else {
        const count = 2 + Math.floor(roomId / 20);
        const types = ['drone', 'droid', 'jumper'];
        const colors = ['#00ffff', '#ff00ff', '#ffff00'];
        
        for (let i = 0; i < count; i++) {
          const idx = (roomId + i) % 3;
          // Much slower speeds for fair gameplay
          const speedX = idx === 0 ? 0.12 : idx === 1 ? 0.08 : 0;
          const speedY = idx === 2 ? -0.1 : idx === 1 ? 0.06 : 0;
          enemies.push({
            x: 30 + ((roomId * 13 + i * 40) % 100),
            y: 20 + ((roomId * 7 + i * 25) % 50),
            type: types[idx],
            dx: speedX, dy: speedY,
            color: colors[idx],
            active: true
          });
        }
      }
      
      // Items based on special markers
      const items = [];
      if (mazeRoom.item === 'WHITE_KEY' || mazeRoom.item === 'BLUE_KEY' || 
          mazeRoom.item === 'GREEN_KEY' || mazeRoom.item === 'RED_KEY') {
        items.push({ x: 140, y: 30, type: 'key', subtype: mazeRoom.item, collected: false });
      } else if (mazeRoom.item === 'MYSTERY') {
        items.push({ x: 80, y: 40, type: 'mystery', collected: false });
      }
      
      return {
        id: roomId,
        mazeRoom: mazeRoom,
        walls, keyholes: [{ x: 10, y: 30, h: 8 }],
        items, enemies, cleared: false
      };
    }
    
    function getRoom(roomId) {
      if (!roomMap.has(roomId)) return null;
      if (!rooms.has(roomId)) {
        rooms.set(roomId, getRoomLayout(roomId));
      }
      return rooms.get(roomId);
    }
    
    // ============================================
    // INPUT
    // ============================================
    window.addEventListener('keydown', (e) => {
      inputKeys.add(e.key);
      
      if (gameState === STATE.TITLE) {
        if (e.key === 'Enter' || e.key === ' ') {
          AudioSys.menuSelect();
          startGame();
        } else if (e.key === 'o' || e.key === 'O') {
          AudioSys.menuSelect();
          gameState = STATE.MAZE_SELECT;
        }
      } else if (gameState === STATE.MAZE_SELECT) {
        if (e.key === 'ArrowUp') {
          selectedMaze = (selectedMaze - 1 + MAZES.length) % MAZES.length;
          AudioSys.menuMove();
        } else if (e.key === 'ArrowDown') {
          selectedMaze = (selectedMaze + 1) % MAZES.length;
          AudioSys.menuMove();
        } else if (e.key === 'Enter' || e.key === ' ') {
          AudioSys.menuSelect();
          startGame();
        } else if (e.key === 'Escape') {
          gameState = STATE.TITLE;
        }
      } else if (gameState === STATE.PLAYING) {
        if (e.key === 'p' || e.key === 'P') {
          gameState = STATE.PAUSED;
        } else if (e.key === 'o' || e.key === 'O') {
          gameState = STATE.MAZE_SELECT;
        }
      } else if (gameState === STATE.PAUSED) {
        if (e.key === 'p' || e.key === 'P') {
          gameState = STATE.PLAYING;
        }
      }
    });

    // ============================================

    // ============================================

      game.score = 0; game.lives = 4; game.keys = 0;
      game.currentRoomId = selectedMaze === 0 ? 0 : selectedMaze === 1 ? 32 :
                           selectedMaze === 2 ? 64 : selectedMaze === 3 ? 96 : 0;
      game.visitedRooms.clear();
      player.x = 80; player.y = 48;
      player.shots = []; player.invulnerable = 180; // 3 seconds spawn protection
      rooms.clear();
      currentRoom = getRoom(game.currentRoomId);
      game.level = currentRoom?.mazeRoom?.level || 'BLACK';
      game.visitedRooms.add(game.currentRoomId);
      gameState = STATE.PLAYING;
    }

      for (const wall of currentRoom.walls) {
        if (x < wall.x + wall.w && x + w > wall.x &&
            y < wall.y + wall.h && y + h > wall.y) return true;
      }
      return false;
    }
    
    function transition(dir) {
      if (!currentRoom || !currentRoom.mazeRoom) return;
      
      const mazeRoom = currentRoom.mazeRoom;
      let nextRoomId = null;
      let px = player.x, py = player.y;
      
      switch(dir) {
        case 'north': nextRoomId = mazeRoom.n; py = 75; break;
        case 'south': nextRoomId = mazeRoom.s; py = 10; break;
        case 'west': nextRoomId = mazeRoom.w; px = 145; break;
        case 'east': nextRoomId = mazeRoom.e; px = 10; break;
      }
      
      if (nextRoomId !== null) {
        const next = getRoom(nextRoomId);
        if (next) {
          game.currentRoomId = nextRoomId;
          currentRoom = next;
          game.level = next.mazeRoom?.level || 'BLACK';
          player.x = px; player.y = py;
          player.shots = [];
          player.invulnerable = 120; // 2 seconds spawn protection
          game.visitedRooms.add(nextRoomId);
          AudioSys.transition();
        }
      }
    }
    
    function update() {
      if (gameState !== STATE.PLAYING) return;
      game.frameCount++;
      
      // Movement
      let dx = 0, dy = 0;
      if (inputKeys.has('ArrowUp') || inputKeys.has('w')) dy = -player.speed;
      if (inputKeys.has('ArrowDown') || inputKeys.has('s')) dy = player.speed;
      if (inputKeys.has('ArrowLeft') || inputKeys.has('a')) dx = -player.speed;
      if (inputKeys.has('ArrowRight') || inputKeys.has('d')) dx = player.speed;
      
      if (dx && dy) { dx *= 0.707; dy *= 0.707; }
      if (dx > 0) player.facing = 'right';
      if (dx < 0) player.facing = 'left';
      
      let nx = player.x + dx, ny = player.y + dy;
      
      // Room transitions
      if (nx < 4) { transition('west'); return; }
      if (nx > 150) { transition('east'); return; }
      if (ny < 8) { transition('north'); return; }
      if (ny > 75) { transition('south'); return; }
      
      if (!checkWall(nx, player.y, player.width, player.height)) player.x = nx;
      if (!checkWall(player.x, ny, player.width, player.height)) player.y = ny;
      
      // Shooting
      const now = performance.now();
      if ((inputKeys.has(' ') || inputKeys.has('z')) && now - player.lastShot > 250) {
        player.lastShot = now;
        player.shots.push({
          x: player.x + player.width / 2, y: player.y + 4,
          dx: player.facing === 'right' ? 3 : -3, life: 50
        });
        AudioSys.shoot();
      }
      
      // Update shots
      player.shots = player.shots.filter(shot => {
        shot.x += shot.dx; shot.life--;
        if (checkWall(shot.x, shot.y, 2, 2)) return false;
        
        for (const enemy of currentRoom.enemies) {
          if (!enemy.active) continue;
          const ex = enemy.x - 4, ey = enemy.y - 4;
          if (shot.x >= ex && shot.x <= ex + 8 && shot.y >= ey && shot.y <= ey + 8) {
            enemy.active = false; game.score += 100;
            AudioSys.enemyDeath();
            return false;
          }
        }
        return shot.life > 0;
      });
      
      // Enemies
      currentRoom.enemies.forEach(enemy => {
        if (!enemy.active) return;
        enemy.x += enemy.dx; enemy.y += enemy.dy;
        if (enemy.x < 10 || enemy.x > 150) enemy.dx *= -1;
        if (enemy.y < 10 || enemy.y > 75) enemy.dy *= -1;
        
        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < 50) {
          const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
          enemy.dx = Math.cos(angle) * 0.4;
          enemy.dy = Math.sin(angle) * 0.4;
        }
        
        if (player.invulnerable <= 0) {
          const px = player.x, py = player.y;
          const ex = enemy.x - 4, ey = enemy.y - 4;
          if (px < ex + 8 && px + player.width > ex && py < ey + 8 && py + player.height > ey) {
            game.lives--; player.invulnerable = 90;
            AudioSys.playerHit();
            if (game.lives <= 0) gameState = STATE.TITLE;
          }
        }
      });
      
      if (currentRoom.enemies.every(e => !e.active)) {
        currentRoom.enemies.forEach(e => e.active = true);
      }
      
      // Items
      currentRoom.items.forEach(item => {
        if (item.collected) return;
        if (Math.hypot(player.x - item.x, player.y - item.y) < 10) {
          item.collected = true; AudioSys.collect();
          if (item.type === 'key') { game.keys++; game.score += 500; }
        }
      });
      
      if (player.invulnerable > 0) player.invulnerable--;
    }
    
    // ============================================
    // RENDERING
    // ============================================
    function getWallColor(off = 0) {
      const c = (game.frameCount + off) % 30;
      if (c < 10) return '#00ffff';
      if (c < 20) return '#ff00ff';
      return '#ffffff';
    }
    
    function drawWall(x, y, w, h, type) {
      const sw = 2;
      if (type === 'h') {
        for (let i = 0; i < h; i += sw) {
          ctx.fillStyle = getWallColor(i);
          ctx.fillRect(x, y + i, w, sw);
        }
      } else {
        for (let i = 0; i < w; i += sw) {
          ctx.fillStyle = getWallColor(i);
          ctx.fillRect(x + i, y, sw, h);
        }
      }
      ctx.fillStyle = '#000';
      if (type === 'h') {
        for (let i = 1; i < h; i += 4) ctx.fillRect(x, y + i, w, 1);
      } else {
        for (let i = 1; i < w; i += 4) ctx.fillRect(x + i, y, 1, h);
      }
    }
    
    function render() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 160, 96);
      
      if (gameState === STATE.TITLE) {
        renderTitle();
      } else if (gameState === STATE.MAZE_SELECT) {
        renderMazeSelect();
      } else if (gameState === STATE.PAUSED) {
        renderGame();
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, 160, 96);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('PAUSED', 60, 45);
        ctx.font = '8px monospace';
        ctx.fillText('Press P to resume', 45, 55);
      } else {
        renderGame();
      }
    }
    
    function renderTitle() {
      // Rainbow title
      const title = 'SHAMUS+';
      const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
      ctx.font = 'bold 16px monospace';
      
      for (let i = 0; i < title.length; i++) {
        ctx.fillStyle = colors[(Math.floor(game.frameCount / 10) + i) % colors.length];
        ctx.fillText(title[i], 50 + i * 10, 30);
      }
      
      // Blinking START
      ctx.fillStyle = Math.floor(game.frameCount / 30) % 2 === 0 ? '#0f0' : '#050';
      ctx.font = '10px monospace';
      ctx.fillText('PRESS ENTER TO START', 25, 50);
      
      // Instructions
      ctx.fillStyle = '#0a0';
      ctx.font = '8px monospace';
      ctx.fillText('ARROWS = Move', 50, 65);
      ctx.fillText('SPACE = Shoot', 50, 73);
      ctx.fillText('O = Maze Selector', 45, 81);
    }
    
    function renderMazeSelect() {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('SELECT MAZE', 50, 15);
      
      MAZES.forEach((maze, i) => {
        const y = 30 + i * 12;
        if (i === selectedMaze) {
          ctx.fillStyle = '#0f0';
          ctx.fillText('>', 35, y);
          ctx.fillStyle = maze.color;
          ctx.fillText(maze.name, 42, y);
        } else {
          ctx.fillStyle = '#444';
          ctx.fillText(maze.name, 42, y);
        }
      });
      
      // Description of selected
      ctx.fillStyle = MAZES[selectedMaze].color;
      ctx.font = '7px monospace';
      ctx.fillText(MAZES[selectedMaze].desc, 20, 90);
      
      ctx.fillStyle = '#0a0';
      ctx.fillText('UP/DOWN = Select | ENTER = Start', 15, 96);
    }
    
    function renderGame() {
      // Walls
      currentRoom.walls.forEach(w => drawWall(w.x, w.y, w.w, w.h, w.type));
      
      // Keyholes
      ctx.fillStyle = '#00ffff';
      currentRoom.keyholes.forEach(kh => {
        ctx.fillRect(kh.x, kh.y, 4, kh.h);
        ctx.fillStyle = '#000';
        ctx.fillRect(kh.x + 1, kh.y + 2, 2, kh.h - 4);
        ctx.fillStyle = '#00ffff';
      });
      
      // Items
      currentRoom.items.forEach(item => {
        if (item.collected) return;
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(item.x - 2, item.y - 2, 4, 4);
      });
      
      // Enemies
      currentRoom.enemies.forEach(enemy => {
        if (!enemy.active) return;
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x - 3, enemy.y - 3, 6, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(enemy.x - 1, enemy.y - 1, 2, 2);
      });
      
      // Shots
      ctx.fillStyle = '#0ff';
      player.shots.forEach(s => ctx.fillRect(s.x - 1, s.y - 1, 2, 2));
      
      // Player
      if (player.invulnerable === 0 || Math.floor(game.frameCount / 4) % 2 === 0) {
        ctx.fillStyle = '#ff0';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(player.x - 1, player.y - 1, player.width + 2, 2);
        ctx.fillStyle = '#fca';
        ctx.fillRect(player.x + 1, player.y + 2, player.width - 2, 3);
        ctx.fillStyle = '#fff';
        if (player.facing === 'right') ctx.fillRect(player.x + player.width, player.y + 4, 3, 2);
        else ctx.fillRect(player.x - 3, player.y + 4, 3, 2);
      }
      
      // HUD
      ctx.fillStyle = '#0f0';
      ctx.font = '8px monospace';
      ctx.fillText(`SCORE:${game.score}`, 2, 94);
      ctx.fillText(`ROOM:${game.currentRoomId}`, 52, 94);
      ctx.fillText(`LIVES:${game.lives}`, 2, 8);
      ctx.fillText(`KEYS:${game.keys}`, 130, 8);
    }
    
    // ============================================
    // MAIN LOOP
    // ============================================
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    
    currentRoom = getRoom(0);
    loop();
  </script>
